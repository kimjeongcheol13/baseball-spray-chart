      h('div', { key: 'stat', ref: R.stat, style: { position: 'absolute', right: 0, bottom: 0, fontFamily: font, fontSize: '11px', letterSpacing: '.12em', fontWeight: 300, color: ink, fontVariantNumeric: 'tabular-nums', pointerEvents: 'none' } })
    ] : [];

    const scene = h('div', { ref: this.rootRef, onPointerDown: this.onDown, onPointerMove: this.onMove, onPointerUp: this.onUp, onPointerCancel: this.onUp,
      style: { position: 'relative', width: '100%', height: '100%', perspective: '1400px', perspectiveOrigin: '50% 22%', cursor: grab ? 'grab' : 'default', touchAction: 'pan-y', userSelect: 'none', WebkitUserSelect: 'none' } },
      h('div', { style: { width: '100%', height: '100%', animation: motion ? 'sc-float 11s ease-in-out infinite' : 'none', animationDelay: (-phase) + 's' } },
        h('div', { ref: this.sceneRef, style: { position: 'relative', width: '100%', height: '100%', transformStyle: 'preserve-3d', transformOrigin: '50% 62%', transform: `rotateX(${tilt}deg) rotateZ(${yaw}deg) scale(${zoom})` } },
          layers)),
      ...overlay);
    return { scene };
  }
}
</script>
