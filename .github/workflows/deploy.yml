name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 배포 전 최소 검사: 실패하면 deploy 잡이 실행되지 않는다
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ?v= 경고용: 이전 커밋과 비교

      - name: Pre-deploy checks (JS syntax, HTML, asset refs, ?v= warning)
        run: python3 .github/scripts/predeploy_check.py "${{ github.event.before }}"

      # 브라우저 테스트(tests/run.mjs): 하나라도 실패하면 이 잡이 실패하고, deploy 잡은 실행되지 않는다
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Browser tests (tests/run.mjs)
        run: node tests/run.mjs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
